services:
  postgres:
    image: postgres:17-alpine
    container_name: esyllabus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - esyllabus-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - esyllabus-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: esyllabus-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      APP_USER_1_USERNAME: ${APP_USER_1_USERNAME:-teacher}
      APP_USER_1_PASSWORD: ${APP_USER_1_PASSWORD:-teacher123}
      APP_USER_1_ROLES: ${APP_USER_1_ROLES:-teacher}

      APP_USER_2_USERNAME: ${APP_USER_2_USERNAME:-director}
      APP_USER_2_PASSWORD: ${APP_USER_2_PASSWORD:-director123}
      APP_USER_2_ROLES: ${APP_USER_2_ROLES:-director}

      APP_USER_3_USERNAME: ${APP_USER_3_USERNAME:-librarian}
      APP_USER_3_PASSWORD: ${APP_USER_3_PASSWORD:-librarian123}
      APP_USER_3_ROLES: ${APP_USER_3_ROLES:-librarian}

      APP_USER_4_USERNAME: ${APP_USER_4_USERNAME:-teacher-colleague}
      APP_USER_4_PASSWORD: ${APP_USER_4_PASSWORD:-teacher123}
      APP_USER_4_ROLES: ${APP_USER_4_ROLES:-teacher}

      APP_USER_5_USERNAME: ${APP_USER_5_USERNAME:-teacher-digital}
      APP_USER_5_PASSWORD: ${APP_USER_5_PASSWORD:-teacher123}
      APP_USER_5_ROLES: ${APP_USER_5_ROLES:-teacher}

      APP_USER_6_USERNAME: ${APP_USER_6_USERNAME:-director-computing}
      APP_USER_6_PASSWORD: ${APP_USER_6_PASSWORD:-director123}
      APP_USER_6_ROLES: ${APP_USER_6_ROLES:-director}

      APP_USER_7_USERNAME: ${APP_USER_7_USERNAME:-teacher-business}
      APP_USER_7_PASSWORD: ${APP_USER_7_PASSWORD:-teacher123}
      APP_USER_7_ROLES: ${APP_USER_7_ROLES:-teacher}

      APP_USER_8_USERNAME: ${APP_USER_8_USERNAME:-director-business}
      APP_USER_8_PASSWORD: ${APP_USER_8_PASSWORD:-director123}
      APP_USER_8_ROLES: ${APP_USER_8_ROLES:-director}

      APP_USER_9_USERNAME: ${APP_USER_9_USERNAME:-teacher-engineering}
      APP_USER_9_PASSWORD: ${APP_USER_9_PASSWORD:-teacher123}
      APP_USER_9_ROLES: ${APP_USER_9_ROLES:-teacher}

      APP_USER_10_USERNAME: ${APP_USER_10_USERNAME:-director-engineering}
      APP_USER_10_PASSWORD: ${APP_USER_10_PASSWORD:-director123}
      APP_USER_10_ROLES: ${APP_USER_10_ROLES:-director}

      APP_USER_11_USERNAME: ${APP_USER_11_USERNAME:-teacher-health}
      APP_USER_11_PASSWORD: ${APP_USER_11_PASSWORD:-teacher123}
      APP_USER_11_ROLES: ${APP_USER_11_ROLES:-teacher}

      APP_USER_12_USERNAME: ${APP_USER_12_USERNAME:-director-health}
      APP_USER_12_PASSWORD: ${APP_USER_12_PASSWORD:-director123}
      APP_USER_12_ROLES: ${APP_USER_12_ROLES:-director}

      APP_USER_13_USERNAME: ${APP_USER_13_USERNAME:-teacher-education}
      APP_USER_13_PASSWORD: ${APP_USER_13_PASSWORD:-teacher123}
      APP_USER_13_ROLES: ${APP_USER_13_ROLES:-teacher}

      APP_USER_14_USERNAME: ${APP_USER_14_USERNAME:-director-education}
      APP_USER_14_PASSWORD: ${APP_USER_14_PASSWORD:-director123}
      APP_USER_14_ROLES: ${APP_USER_14_ROLES:-director}

      APP_USER_15_USERNAME: ${APP_USER_15_USERNAME:-librarian-sciences}
      APP_USER_15_PASSWORD: ${APP_USER_15_PASSWORD:-librarian123}
      APP_USER_15_ROLES: ${APP_USER_15_ROLES:-librarian}

      DU_ENABLED: ${DU_ENABLED:-false}
      DU_BASE_URL: ${DU_BASE_URL:-https://bridge-du.astanait.edu.kz}
      DU_JWT_ENABLED: ${DU_JWT_ENABLED:-false}
      DU_JWT_SECRET: ${DU_JWT_SECRET:-}
    ports:
      - "${APP_PORT}:8080"
    networks:
      - esyllabus-network

volumes:
  esyllabus-postgres-data:

networks:
  esyllabus-network:
    name: esyllabus-network
