services:
  postgres:
    image: postgres:17-alpine
    container_name: esyllabus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - esyllabus-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - esyllabus-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: esyllabus-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      APP_USER_1_USERNAME: ${APP_USER_1_USERNAME:-teacher}
      APP_USER_1_PASSWORD: ${APP_USER_1_PASSWORD:-teacher123}
      APP_USER_1_ROLES: ${APP_USER_1_ROLES:-teacher}

      APP_USER_2_USERNAME: ${APP_USER_2_USERNAME:-director}
      APP_USER_2_PASSWORD: ${APP_USER_2_PASSWORD:-director123}
      APP_USER_2_ROLES: ${APP_USER_2_ROLES:-director}

      APP_USER_3_USERNAME: ${APP_USER_3_USERNAME:-librarian}
      APP_USER_3_PASSWORD: ${APP_USER_3_PASSWORD:-librarian123}
      APP_USER_3_ROLES: ${APP_USER_3_ROLES:-librarian}

      APP_USER_4_USERNAME: ${APP_USER_4_USERNAME:-student}
      APP_USER_4_PASSWORD: ${APP_USER_4_PASSWORD:-student123}
      APP_USER_4_ROLES: ${APP_USER_4_ROLES:-student}

      APP_USER_5_USERNAME: ${APP_USER_5_USERNAME:-teacher-colleague}
      APP_USER_5_PASSWORD: ${APP_USER_5_PASSWORD:-teacher123}
      APP_USER_5_ROLES: ${APP_USER_5_ROLES:-teacher}

      APP_USER_6_USERNAME: ${APP_USER_6_USERNAME:-student-two}
      APP_USER_6_PASSWORD: ${APP_USER_6_PASSWORD:-student123}
      APP_USER_6_ROLES: ${APP_USER_6_ROLES:-student}

      APP_USER_7_USERNAME: ${APP_USER_7_USERNAME:-teacher-digital}
      APP_USER_7_PASSWORD: ${APP_USER_7_PASSWORD:-teacher123}
      APP_USER_7_ROLES: ${APP_USER_7_ROLES:-teacher}

      APP_USER_8_USERNAME: ${APP_USER_8_USERNAME:-director-computing}
      APP_USER_8_PASSWORD: ${APP_USER_8_PASSWORD:-director123}
      APP_USER_8_ROLES: ${APP_USER_8_ROLES:-director}

      APP_USER_9_USERNAME: ${APP_USER_9_USERNAME:-student-computing-1}
      APP_USER_9_PASSWORD: ${APP_USER_9_PASSWORD:-student123}
      APP_USER_9_ROLES: ${APP_USER_9_ROLES:-student}

