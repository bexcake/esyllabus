services:
  postgres:
    image: postgres:17-alpine
    container_name: esyllabus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - esyllabus-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - esyllabus-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: esyllabus-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      DU_ENABLED: ${DU_ENABLED:-true}
      DU_BASE_URL: ${DU_BASE_URL:-https://bridge-du.astanait.edu.kz}
      DU_CACHE_ENABLED: ${DU_CACHE_ENABLED:-true}
      DU_CACHE_REFRESH_INTERVAL: ${DU_CACHE_REFRESH_INTERVAL:-12h}
      DU_CACHE_REFRESH_CRON: "${DU_CACHE_REFRESH_CRON:-0 0 */12 * * *}"
      DU_CACHE_PAGE_SIZE: ${DU_CACHE_PAGE_SIZE:-100}
      DU_CACHE_MAX_PAGES: ${DU_CACHE_MAX_PAGES:-50}
      DU_JWT_ENABLED: ${DU_JWT_ENABLED:-true}
      DU_JWT_SECRET: ${DU_JWT_SECRET:-}
    ports:
      - "${APP_PORT}:8080"
    networks:
      - esyllabus-network

volumes:
  esyllabus-postgres-data:

networks:
  esyllabus-network:
    name: esyllabus-network
