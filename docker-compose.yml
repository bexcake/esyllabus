      APP_USER_19_USERNAME: teacher-education
      APP_USER_19_PASSWORD: teacher123
      APP_USER_19_ROLES: teacher
      APP_USER_20_USERNAME: director-education
      APP_USER_20_PASSWORD: director123
      APP_USER_20_ROLES: director
      APP_USER_21_USERNAME: student-education-1
