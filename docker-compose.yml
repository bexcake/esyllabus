services:
  postgres:
    image: postgres:17-alpine
    container_name: esyllabus-postgres
    environment:
      POSTGRES_DB: esyllabus
      POSTGRES_USER: esyllabus
      POSTGRES_PASSWORD: esyllabus
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esyllabus -d esyllabus"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    container_name: esyllabus-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/esyllabus
      DB_USER: esyllabus
      DB_PASSWORD: esyllabus
      DU_ENABLED: ${DU_ENABLED:-true}
      DU_BASE_URL: ${DU_BASE_URL:-https://bridge-du.astanait.edu.kz}
      DU_JWT_ENABLED: ${DU_JWT_ENABLED:-true}
      DU_JWT_SECRET: ${DU_JWT_SECRET:-}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres-data:
