services:
  postgres:
    image: postgres:17-alpine
    container_name: esyllabus-postgres
    environment:
      POSTGRES_DB: esyllabus
      POSTGRES_USER: esyllabus
      POSTGRES_PASSWORD: esyllabus
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esyllabus -d esyllabus"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    container_name: esyllabus-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/esyllabus
      DB_USER: esyllabus
      DB_PASSWORD: esyllabus
      APP_USER_1_USERNAME: teacher
      APP_USER_1_PASSWORD: teacher123
      APP_USER_1_ROLES: teacher
      APP_USER_2_USERNAME: director
      APP_USER_2_PASSWORD: director123
      APP_USER_2_ROLES: director
      APP_USER_3_USERNAME: librarian
      APP_USER_3_PASSWORD: librarian123
      APP_USER_3_ROLES: librarian
      APP_USER_4_USERNAME: student
      APP_USER_4_PASSWORD: student123
      APP_USER_4_ROLES: student
      APP_USER_5_USERNAME: teacher-colleague
      APP_USER_5_PASSWORD: teacher123
      APP_USER_5_ROLES: teacher
      APP_USER_6_USERNAME: student-two
      APP_USER_6_PASSWORD: student123
      APP_USER_6_ROLES: student
      APP_USER_7_USERNAME: teacher-digital
      APP_USER_7_PASSWORD: teacher123
      APP_USER_7_ROLES: teacher
      APP_USER_8_USERNAME: director-computing
      APP_USER_8_PASSWORD: director123
      APP_USER_8_ROLES: director
      APP_USER_9_USERNAME: student-computing-1
      APP_USER_9_PASSWORD: student123
      APP_USER_9_ROLES: student
      APP_USER_10_USERNAME: teacher-business
      APP_USER_10_PASSWORD: teacher123
      APP_USER_10_ROLES: teacher
      APP_USER_11_USERNAME: director-business
      APP_USER_11_PASSWORD: director123
      APP_USER_11_ROLES: director
      APP_USER_12_USERNAME: student-business-1
      APP_USER_12_PASSWORD: student123
      APP_USER_12_ROLES: student
      APP_USER_13_USERNAME: teacher-engineering
      APP_USER_13_PASSWORD: teacher123
      APP_USER_13_ROLES: teacher
      APP_USER_14_USERNAME: director-engineering
      APP_USER_14_PASSWORD: director123
      APP_USER_14_ROLES: director
      APP_USER_15_USERNAME: student-engineering-1
      APP_USER_15_PASSWORD: student123
      APP_USER_15_ROLES: student
      APP_USER_16_USERNAME: teacher-health
      APP_USER_16_PASSWORD: teacher123
      APP_USER_16_ROLES: teacher
      APP_USER_17_USERNAME: director-health
      APP_USER_17_PASSWORD: director123
