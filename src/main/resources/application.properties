spring.application.name=esyllabus
spring.datasource.url=${DB_URL:jdbc:h2:mem:esyllabus;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.http.converters.preferred-json-mapper=jackson2
springdoc.swagger-ui.path=/swagger-ui.html

app.security.users[0].username=${APP_USER_1_USERNAME:teacher}
app.security.users[0].password=${APP_USER_1_PASSWORD:teacher123}
app.security.users[0].roles=${APP_USER_1_ROLES:teacher}
app.security.users[1].username=${APP_USER_2_USERNAME:director}
app.security.users[1].password=${APP_USER_2_PASSWORD:director123}
app.security.users[1].roles=${APP_USER_2_ROLES:director}
app.security.users[2].username=${APP_USER_3_USERNAME:librarian}
app.security.users[2].password=${APP_USER_3_PASSWORD:librarian123}
app.security.users[2].roles=${APP_USER_3_ROLES:librarian}
app.security.users[3].username=${APP_USER_4_USERNAME:student}
app.security.users[3].password=${APP_USER_4_PASSWORD:student123}
app.security.users[3].roles=${APP_USER_4_ROLES:student}

digital-university.enabled=false
digital-university.base-url=http://localhost:8090
digital-university.roles-path=/api/users/{email}/roles
digital-university.connect-timeout=5s
digital-university.read-timeout=10s
digital-university.auth-header-name=X-Api-Key
digital-university.auth-header-value=

megapro.enabled=false
megapro.base-url=http://localhost:8091
megapro.search-path=/api/books/search
megapro.connect-timeout=5s
megapro.read-timeout=10s
megapro.auth-header-name=X-Api-Key
megapro.auth-header-value=
megapro.sync-enabled=true
megapro.sync-cron=0 0 3 * * *
megapro.sync-limit-per-course=12
