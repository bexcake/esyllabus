digital-university.enabled=false
digital-university.base-url=http://localhost:8090
digital-university.roles-path=/api/users/{email}/roles
digital-university.connect-timeout=5s
digital-university.read-timeout=10s
digital-university.auth-header-name=X-Api-Key
digital-university.auth-header-value=

megapro.enabled=false
megapro.base-url=http://localhost:8091
megapro.search-path=/api/books/search
megapro.connect-timeout=5s
megapro.read-timeout=10s
megapro.auth-header-name=X-Api-Key
megapro.auth-header-value=
megapro.sync-enabled=true
megapro.sync-cron=0 0 3 * * *
megapro.sync-limit-per-course=12
