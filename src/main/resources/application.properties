digital-university.enabled=${DU_ENABLED:false}
digital-university.base-url=${DU_BASE_URL:https://bridge-du.astanait.edu.kz}
digital-university.student-path=/api/v1/students/{studentEmail}
digital-university.students-path=/api/v1/user/students
digital-university.employees-path=/api/v1/user/employees
digital-university.employee-path=/api/v1/employees/{employeeId}
digital-university.schools-path=/api/v1/schools
digital-university.education-programs-path=/api/v1/education_programs
digital-university.teacher-disciplines-path=/api/v1/teacher_disciplines
digital-university.connect-timeout=5s
digital-university.read-timeout=10s
digital-university.jwt.enabled=${DU_JWT_ENABLED:false}
digital-university.jwt.secret=${DU_JWT_SECRET:}
digital-university.jwt.clock-skew=60s
digital-university.jwt.principal-claims=email,preferred_username,username,login,sub
digital-university.jwt.display-name-claims=full_name,name,displayName,display_name
digital-university.jwt.role-claims=roles,role,authorities,groups,scope,scopes

megapro.enabled=false
megapro.base-url=http://localhost:8091
megapro.search-path=/api/books/search
megapro.connect-timeout=5s
megapro.read-timeout=10s
megapro.auth-header-name=X-Api-Key
megapro.auth-header-value=
megapro.sync-enabled=true
megapro.sync-cron=0 0 3 * * *
megapro.sync-limit-per-course=12
